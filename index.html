p","Etanol Metabolizması: Etanol → Asetaldehit (ADH) → Asetat (ALDH2) → Asetil-KoA"],outgoing:["1. TCA Döngüsü: + Oksaloasetat → Sitrat (Sitrat Sentaz)","2. Ketogenez (Karaciğer Mitokondrisi, Açlık): mHMG-KoA Sentaz → Asetoasetat & β-Hidroksibütirat","3. Yağ Asidi Sentezi (Sitozol, Tokluk): Sitrat Mekiği → Sitozolik Asetil-KoA → ACC [+] Sitrat, İnsülin | [-] Palmitoil-KoA, AMPK → Malonil-KoA → Palmitat","4. Kolesterol Sentezi (Sitozol & ER): HMG-KoA Redüktaz [+] İnsülin | [-] Statinler, Kolesterol, AMPK → Mevalonat → Kolesterol","5. Allosterik Sinyal: Pirüvat Karboksilaz'ı [+] zorunlu aktive eder, PDH Kinaz'ı [+] açarak PDH'yi [-] inhibe eder, NAGS ile NAG (Üre döngüsü aktivatörü) oluşturur!"]},{id:"j-sitrat",name:"6. Sitrat (6C) ↔ Malonil-KoA (3C) Köprüsü",compartment:"Mitokondri → Sitozol",badge:"TCA ↔ Lipogenez ↔ β-Oksidasyon Kilidi",incoming:["TCA Döngüsü Basamak 1: Oksaloasetat + Asetil-KoA → Sitrat Sentaz","Toklukta yüksek ATP ve NADH nedeniyle İzositrat Dehidrogenaz (IDH) [-] inhibe olduğunda mitokondride Sitrat birikir"],outgoing:["1. TCA Döngüsü Devamı: Akonitaz ([-] Floroasetat) → İzositrat → α-Ketoglutarat","2. Sitrat Mekiği ile Sitozole Çıkış: ATP-Sitrat Liyaz ([-] Bempedoik asit, Hidroksisitrat) → Sitozolik Asetil-KoA + OAA","3. Allosterik Düzenleme: Sitozolik Sitrat, Yağ Asidi Sentezindeki ACC'yi [+] güçlü şekilde aktive ederken, Glikolizdeki PFK-1'i [-] inhibe eder ve FBPaz-1'i [+] aktive eder!","4. Malonil-KoA Freni: ACC ürünü olan Malonil-KoA, CPT-I'i [-] bloke ederek β-oksidasyonu kilitler!"]},{id:"j-alfakg",name:"7. α-Ketoglutarat (5C) ↔ L-Glutamat Köprüsü",compartment:"Mitokondri Matriksi & Sitozol",badge:"TCA ↔ Amino Asit & Azot Köprüsü",incoming:["TCA Döngüsü: İzositrat → İzositrat Dehidrogenaz (IDH — Hız Kısıtlayıcı!) [+] ADP, Ca²⁺ | [-] ATP, NADH","Amino Asit Katabolizması (5C Ailesi): Glutamin, Prolin, Arjinin, Histidin → Glutamat → GDH / Transaminazlar → α-Ketoglutarat"],outgoing:["1. TCA Devamı: α-Ketoglutarat Dehidrogenaz (α-KGDH) [+] Ca²⁺ | [-] Süksinil-KoA, NADH, Arsenit → Süksinil-KoA","2. Transaminasyon (ALT/AST [PLP/B6]): Amino asitlerin amino gruplarını toplayarak L-Glutamat oluşturur","3. Oksidatif Deaminasyon (GDH): Glutamat ↔ α-KG + Serbest NH₄⁺ (Üre Döngüsü CPS-I'e 1. azotu verir!)","4. Nörotransmitter & Antioksidan Sentezi: Glutamat → GABA (Glutamat Dekarboksilaz [PLP/B6]) ve Glutatyon (GSH = γ-Glu-Cys-Gly)"]},{id:"j-suksinilkoa",name:"8. Süksinil-KoA (4C) — 4 Yolaklı Kavşak",compartment:"Mitokondri Matriksi",badge:"TCA ↔ B12/Propiyonil ↔ Hem ↔ Ketoliz",incoming:["TCA Döngüsü: α-Ketoglutarat → α-KGDH Kompleksi (TPP, Lipoat, CoA, FAD, NAD⁺)","Tek Sayıda Karbonlu Yağ Asitleri + Amino Asitler (Valin, İzolösin, Metiyonin, Treonin) + Kolesterol Yan Zinciri: Propiyonil-KoA (3C) → Propiyonil-KoA Karboksilaz (B7-Biyotin) → Metilmalonil-KoA Mutaz (B12-Adenozilkobalamin!) → Süksinil-KoA"],outgoing:["1. TCA Devamı & Glukoneogenez: Süksinil-KoA Sentetaz → Süksinat + GTP (Malat → OAA → PEPCK üzerinden net Glukoz sentezlenir!)","2. Hem (Porfirin) Sentezi: Süksinil-KoA + Glisin → δ-Aminolevülinat (Hız Kısıtlayıcı: ALA Sentaz [PLP/B6] — karaciğer ALAS1: [-] Hem ve Glukoz ile baskılanır, [+] Barbitüratlar/CYP450 indükleyicileri ile indüklenir; eritroid ALAS2 ise demir/IRE ile düzenlenir, eksikliği X’e bağlı sideroblastik anemi yapar)","3. Ketoliz (Periferik Dokular): Tiyoforaz (SCOT) ile Asetoasetat'a CoA aktararak Asetoasetil-KoA oluşturur","4. Allosterik Geri Bildirim: Sitrat Sentaz, α-KGDH ve mHMG-KoA Sentaz'ı [-] inhibe eder!"]},{id:"j-fumarat-oaa",name:'9. Fumarat & Oksaloasetat (OAA) — "Krebs Bisikleti"',compartment:"Mitokondri ↔ Sitozol",badge:"TCA ↔ Üre Döngüsü ↔ Glukoneogenez",incoming:["TCA Döngüsü: Süksinat → SDH (Kompleks II, [-] Malonat) → Fumarat → Fumaraz → Malat → MDH → OAA","Anapleroz: Pirüvat → Pirüvat Karboksilaz ([+] Asetil-KoA, Biyotin) → OAA","Üre Döngüsü (Sitozol): Arjininosüksinat → Arjininosüksinat Liyaz (ASL) → Arjinin + Fumarat","Amino Asitler: Aspartat & Asparajin → OAA | Fenilalanin & Tirozin → Fumarat"],outgoing:["1. TCA Döngüsü Başlangıcı: OAA + Asetil-KoA → Sitrat (Sitrat Sentaz)","2. Glukoneogenez: OAA → PEPCK (GTP) → Fosfoenolpirüvat (PEP) → Glukoz","3. Üre Döngüsü 2. Azot Kaynağı: OAA + Glutamat → AST (PLP/B6) → L-Aspartat (Sitozole çıkarak ASS basamağında Sitrülin ile birleşir!)","4. Malat-Aspartat Mekiği: Sitozolik NADH'nin mitokondriye taşınmasını sağlar"]},{id:"j-etz",name:"10. NADH / FADH₂ / CoQ — Elektron Taşıma Kavşağı",compartment:"İç Mitokondri Membranı",badge:"Redoks & ATP Üretim Merkezi",incoming:["Kompleks I'e Giren NADH'ler: PDH, İzositrat Dehidrogenaz, α-KGDH, Malat Dehidrogenaz, β-Oksidasyon (3-OH-Açil-KoA Dehidrogenaz), GDH, β-Hidroksibütirat Dehidrogenaz, Malat-Aspartat Mekiği","Koenzim Q (Ubikinon) Havuzuna FADH₂ Üzerinden Doğrudan Girenler: (1) Kompleks II (Süksinat Dehidrogenaz), (2) β-Oksidasyon (Açil-KoA Dehidrogenaz / ETF-Qo), (3) Gliserol-3-Fosfat Mekiği, (4) Dihidroorotat Dehidrogenaz (FMN; Pirimidin sentezi — elektronları doğrudan CoQ’ya verir)"],outgoing:["Kompleks III ([-] Antimisin A) → Sitokrom c → Kompleks IV ([-] CN⁻, CO, H₂S, NaN₃) → H₂O","Kompleks V (F₀F₁ ATP Sentaz, [-] Oligomisin) → ATP Üretimi (Ayırıcılar [2,4-DNP, Termogenin/UCP1, Aspirin] proton gradyentini ısıya dönüştürür!)"]}],MAP_NODES=[{id:"n-glukoz",x:420,y:90,w:170,h:48,title:"SERBEST GLUKOZ (6C)",sub:"Kan ↔ Sitozol (GLUT 1-4)",type:"metabolite",pathway:"glikoliz",junctionId:"j-g6p"},{id:"n-hk",x:420,y:165,w:205,h:46,title:"Heksokinaz / Glukokinaz",sub:"G6Paz (ER Bypass)",type:"enzyme",pathway:"glikoliz",junctionId:"j-g6p",plus:"İnsülin, Glukoz, F1P",minus:"G6P (HK I-III), F6P (GKRP)"},{id:"n-g6p",x:420,y:245,w:195,h:52,title:"GLUKOZ-6-FOSFAT (G6P)",sub:"★ Karbonhidrat Ana Kavşağı",type:"hub",pathway:"glikoliz",junctionId:"j-g6p"},{id:"n-g1p",x:135,y:245,w:165,h:46,title:"Glukoz-1-P ↔ UDP-Glc",sub:"Fosfoglukomutaz",type:"metabolite",pathway:"glikojen",junctionId:"j-g6p"},{id:"n-gs-gp",x:135,y:150,w:190,h:52,title:"⚡ Glikojen Sentaz / Fo ive eder.",effect:"Üre döngüsü yeniden işler, amonyak düşer.",clinical:"NAGS eksikliğinde ve propiyonik/metilmalonik asidemide akut hiperamonyemi tedavisinde kullanılır.",pearl:"NAGS eksikliğinde tedavi karglumik asittir.",links:[{pw:"ure_aa",idx:1}]},{id:"sodyum-benzoat",name:"Sodyum benzoat",kind:"ilac",target:"Glisin",action:"substrat-analogu",mechanism:"Benzoil-KoA üzerinden glisinle konjuge olup hippurat oluşturur (1 mol benzoat ≈ 1 N atomu); hippurat idrarla atılır.",effect:"Alternatif azot atılımıyla amonyak düşer.",clinical:"Hiperamonyemi tedavisi.",pearl:"Benzoat → hippurat (glisin); fenilbütirat → fenilasetilglutamin (glutamin).",links:[{pw:"ure_aa",idx:2}]},{id:"fenilbutirat",name:"Sodyum fenilbütirat / fenilasetat",kind:"ilac",target:"Glutamin",action:"substrat-analogu",mechanism:"Karaciğerde β-oksidasyonla fenilasetata dönüşür; fenilasetil-KoA glutaminle konjuge olup fenilasetilglutamin verir (≈ 2 N atomu/mol) ve idrarla atılır.",effect:"Glutamin ile azot atılımı; amonyak düşer.",clinical:"Üre döngüsü bozukluklarında amonyak süpürücü tedavi.",pearl:"Akut hiperamonyemide IV fenilasetat + benzoat kombinasyonu kullanılır.",links:[{pw:"ure_aa",idx:2}]},{id:"alfa-metil-aspartat",name:"α-Metil-DL-aspartat",kind:"deneysel",target:"Arjininosüksinat sentetaz (ASS)",action:"inhibitor",mechanism:"Aspartat analoğu olarak ASS’yi inhibe eder.",effect:"Sitrülin + aspartat birleşimi engellenir.",links:[{pw:"ure_aa",idx:2}]},{id:"metanol-etilen-glikol",name:"Metanol ve etilen glikol",aka:"Toksik alkoller",kind:"toksin",target:"Alkol dehidrogenaz (ADH) ile toksik metabolitlere dönüşüm",action:"substrat-analogu",mechanism:"Etanol gibi ADH substratıdır; metanol formaldehit ve formik asite, etilen glikol glikoaldehit, glikolat ve oksalata dönüşür. Formik asit Kompleks IV’ü (sitokrom c oksidaz) inhibe eder.",effect:"Anyon açıklı metabolik asidoz; Kompleks IV inhibisyonuyla hücresel hipoksi benzeri tablo.",clinical:"Metanol: görme bulanıklığı (“kar fırtınası”), optik sinir hasarı ve körlük, bazal ganglion nekrozu. Etilen glikol: kalsiyum oksalat kristalleri (idrarda), akut böbrek yetmezliği, hipokalsemi. Erken dönemde ozmolar açık ↑, geç dönemde anyon açığı ↑.",antidote:"Fomepizol (ADH inhibitörü); alternatif etanol; hemodiyaliz; metanolde folinik asit (format yıkımını hızlandırır)",pearl:"Fomepizol ve etanol ADH’ye bağlanıp toksik metabolit oluşumunu engeller; ADH’nin etanole afinitesi daha yüksektir.",links:[{pw:"etz",idx:1}]},{id:"disulfiram",name:"Disülfiram",kind:"ilac",target:"Aldehit dehidrogenaz (ALDH)",action:"inhibitor",mechanism:"ALDH’yi geri dönüşümsüz inhibe eder; etanol → asetaldehit basamağından sonra asetaldehit asetata yükseltgenemez.",effect:"Alkol alımında asetaldehit birikir.",clinical:"Alkol bağımlılığı tedavisinde caydırıcı olarak kullanılır; alkolle yüz kızarması (flushing), bulantı, taşikardi ve hipotansiyon yapar.",pearl:"ALDH2*2 varyantı (Doğu Asya) benzer tablo verir; metronidazol ve bazı sefalosporinler de disülfiram benzeri reaksiyon yapar.",links:[{pw:"glukoneogenez",idx:1}]}],window.BIO_CLINICAL_SUMMARY={"glikoliz:0":{title:"MODY tip 2 ve heksokinaz eksikliği",text:"GCK heterozigot kaybında β-hücre glukoz eşiği ~5 mM’dan ~7-8 mM’a çıkar ve hafif, ilerlemeyen açlık hiperglisemisi olur. Eritrosit HK-I eksikliğinde 2,3-BPG azalır, eğri sola kayar, hemolitik anemi gelişir."},"glikoliz:1":{title:"GPI eksikliği ve otokrin motilite faktörü (AMF)",text:"Mitokondrisiz eritrosit ATP için glikolize bağımlıdır; GPI eksikliğinde Na⁺/K⁺- ve Ca²⁺-ATPaz enerjisiz kalır, hücre dalakta yıkılır (nonsferositik hemolitik anemi). Hücre dışı GPI, AMF olarak tümör metastazını uyarır."},"glikoliz:2":{title:"Tarui hastalığı (PFK-1 eksikliği)",text:"Kas PFK-1 eksikliğinde egzersizde glikoliz durur; McArdle’dan farkı, glukoz/sükroz alımının insülinle yağ asidi yıkımını baskılayarak semptomları ağırlaştırmasıdır. Eritrositte hemolitik anemi görülür."},"glikoliz:3":{title:"Herediter fruktoz intoleransı ve TPI eksikliği",text:"Aldolaz B eksikliğinde F1P birikir, Pᵢ tükenir (fosfat tuzağı); glikojenoliz ve glukoneogenez baskılanır: hipoglisemi, karaciğer yetmezliği, hiperürisemi. TPI eksikliğinde DHAP → metilglioksal, hemoliz ve ağır nörodejenerasyon yapar."},"glikoliz:4":{title:"Arsenat kenet çözülmesi ve 2,3-BPG şantı",text:"Arsenat Pᵢ yerine geçer, 1-arseno-3-fosfogliserat kendiliğinden hidrolize olur; PGK atlanır ve net ATP sıfırlanır. Eritrositte 1,3-BPG’nin bir kısmı 2,3-BPG’ye döner; Hb’nin T formunu stabilize edip eğriyi sağa kaydırır."},"glikoliz:5":{title:"X’e bağlı fosfogliserat kinaz (PGK) eksikliği",text:"PGK glikolizde X kromozomunda kodlanan tek enzimdir. Eksikliğinde eritrosit ve SSS’de ATP düşer, biriken 1,3-BPG 2,3-BPG’yi artırır; hemolitik anemi, rabdomiyoliz ve mental retardasyon/epilepsi görülür."},"glikoliz:6":{title:"Florür toksisitesi ve pre-analitik glikoliz blokajı",text:"F⁻, Mg²⁺ ve Pᵢ ile floro-fosfat-magnezyum kompleksi yaparak enolazı durdurur. Bu yüzden gri kapaklı tüplere NaF eklenir (eritrositler saatte ~5-7 mg/dL glukoz tüketir). Zehirlenmede hipokalsemi ve hiperkalemik aritmi olur."},"glikoliz:7":{title:"Pirüvat kinaz (PK) eksikliği",text:"Eritrositte net ATP düşer, Na⁺/K⁺-ATPaz durur; hücre büzüşür (ekinosit/burr cell) ve dalakta hemolize uğrar. Biriken PEP ve 1,3-BPG 2,3-BPG’yi 2-3 kat artırır, Hb-O₂ afinitesi düşer; düşük Hb iyi tolere edilir."},"glukoneogenez:0":{title:"Pirüvat karboksilaz eksikliği ve biyotin",text:"Pirüvat → OAA yapılamaz: glukoneogenez durur (açlık hipoglisemisi), pirüvat laktat ve alanine kayar (laktik asidoz), TCA anaplerozu kesilir (Leigh benzeri ensefalopati). OAA → aspartat da azaldığından üre döngüsü aksar."},"glukoneogenez:1":{title:"Akut etanol hipoglisemisi",text:"Alkol metabolizması NADH/NAD⁺ oranını yükseltir; pirüvat → laktat, OAA → malat, DHAP → gliserol-3-P kayar. PEPCK substrat (OAA) bulamaz, glukoneogenez durur: hipoglisemi, laktik asidoz ve laktata bağlı hiperürisemi (gut atağı)."},"glukoneogenez:2":{title:"Fruktoz-1,6-bisfosfataz-1 (FBPaz-1) eksikliği",text:"Glikojen depoları dolu iken kan şekeri normaldir ve glukagon yanıt verir (Von Gierke’den farkı). Uzamış açlıkta veya fruktoz/gliserol yüklemesinde glukoneogenez yapılamaz: ketotik hipoglisemi, laktik asidoz, hepatomegali."},"glukoneogenez:3":{title:"Von Gierke hastalığı (GSD tip Ia / Ib)",text:"G6Paz eksikliğinde glikojenoliz ve glukoneogenezin son basamağı kapanır, G6P birikir: hipoglisemi, laktik asidoz, hiperürisemi, hipertrigliseridemi ve hepatorenomegali. Tip Ib’de (G6P-T1) ek olarak nötropeni ve enfeksiyonlar görülür."},"glikojen:0":{title:"PGM1-CDG ve Crigler-Najjar / Gilbert bağlantısı",text:"PGM1 eksikliğinde G6P ↔ G1P bozulur; glikojen metabolizması ve N-glikozilasyon aksar (galaktoz tedavisi). UDP-glukuronat UGT1A1 ile bilirubin konjugasyonu için gerekir: Gilbert hafif, Crigler-Najjar tip I ağır kernikterus yapar."},"glikojen:1":{title:"GSD tip 0 ve Andersen hastalığı (GSD tip IV)",text:"GYS2 eksikliğinde (tip 0) karaciğerde glikojen depolanmaz: hepatomegali yoktur, postprandiyal hiperglisemi ve açlıkta ketotik hipoglisemi olur. GBE1 eksikliğinde (tip IV) anormal yapıda, dallanmasız uzun zincirli glikojen birikir; ilerleyici siroz ve ölüm."},"glikojen:2":{title:"Glikojen depo hastalıkları: McArdle, Cori, Pompe",text:"McArdle (kas fosforilaz): laktat yükselmez, NH₃ artar, kramp/miyoglobinüri ve second wind görülür. Cori (dal kırıcı): anormal yapıda glikojen (limit dekstrin) birikir, laktat/ürat normaldir. Pompe (lizozomal asit maltaz): normoglisemi, kardiyomegali, floppy infant."},"hmp:0":{title:"G6PD eksikliği",text:"Eritrositte NADPH’nin tek kaynağı pentoz fosfat yoludur. G6PD eksikliğinde oksidan yük altında GSH yenilenemez, H₂O₂ birikir; Heinz cisimcikleri ve bite cell ile akut hemoliz, hemoglobinüri ve sarılık gelişir."},"hmp:3":{title:"Riboz-5-fosfat izomeraz (RPIA) eksikliği",text:"Çok nadir otozomal resesif hastalıktır; lökoensefalopati ve gelişimsel bozuklukla seyreder. İdrarda poliol (ribitol, arabitol) atılımı artar."},"hmp:4":{title:"Wernicke-Korsakoff sendromu ve PRPP sentetaz süperaktivitesi",text:"B1 eksikliğinde transketolaz, PDH ve α-KGDH birlikte durur; tiyaminden önce dekstroz verilmek kalan TPP’yi tüketip Wernicke ensefalopatisini ve Korsakoff psikozunu tetikler. PRPP sentetaz aşırı aktivitesi hiperürisemi/gut yapar."},"hmp:5":{title:"Transaldolaz (TALDO1) eksikliği",text:"Nadir otozomal resesif hastalıktır; yenidoğanda hepatosplenomegali, karaciğer disfonksiyonu/siroz ve kanama eğilimi görülür. İdrarda eritritol, ribitol, arabitol ve sedoheptuloz artar."},"pdh:0":{title:"PDH kompleksi eksikliği ve arsenit zehirlenmesi",text:"PDHA1 (E1α) mutasyonunda pirüvat asetil-KoA’ya çevrilemez: konjenital laktik asidoz (L/P oranı normal), Leigh sendromu; ketojenik diyet, yüksek doz B1 ve DCA kullanılır. Arsenit ve Hg, E2’deki lipoik asidin -SH gruplarını bağlar."},"tca:0":{title:"Oksaloasetat darboğazı ve diyabetik ketoasidoz",text:"Sitrat sentaz OAA ister. Açlıkta ve kontrolsüz tip 1 diyabette OAA glukoneogeneze çekilince β-oksidasyon asetil-KoA’sı TCA’ya giremez, ketogeneze taşar: DKA (anyon açıklı asidoz, Kussmaul, aseton kokusu)."},"tca:1":{title:"Floroasetat zehirlenmesi (letal sentez) ve demir homeostazı",text:"Floroasetat florositrata dönüşür (letal sentez); florositrat akonitazı kilitler, sitrat birikir (hipokalsemik tetani, ATP çöküşü, VF). Sitozolik akonitaz (IRP-1) demir eksikliğinde TfR mRNA’sını korur, ferritini baskılar."},"tca:2":{title:"IDH1/IDH2 mutant tümörler (onkometabolit D-2-HG)",text:"Mutant IDH, α-KG’yi NADPH harcayarak D-2-HG’ye indirger; D-2-HG TET2 ve Jumonji demetilazlarını inhibe eder, CpG hipermetilasyonu (CIMP) ile farklılaşma durur (glioma, AML). Hedef ilaçlar: ivosidenib (IDH1), enasidenib (IDH2)."},"tca:3":{title:"α-KGDH eksikliği ve E3 bozukluğu",text:"α-KGDH, PDH ve BCKDH aynı E3 alt birimini ve 5 koenzimi paylaşır; E3 mutasyonunda üçü birden durur: laktik asidoz, idrarda α-KG artışı, dallı zincirli aminoasit/ketoasit birikimi ve nörolojik yıkım. α-KGDH ROS’a en duyarlı enzimdir."},"tca:4":{title:"Süksinil-KoA sentetaz eksikliği (SUCLA2/SUCLG1)",text:"Enzim TCA’daki substrat düzeyinde fosforilasyonu yapar ve NDPK ile dNTP havuzunu koruyarak mtDNA’yı destekler. Eksiklikte ensefalomiyopati, distoni, işitme kaybı, laktik asidoz ve hafif metilmalonik asidüri olur."},"tca:5":{title:"SDH mutasyonlu feokromositoma / paraganglioma",text:"SDH kaybında (veya malonat blokajında) biriken süksinat sitozole çıkıp prolil hidroksilazı inhibe eder; HIF-1α normoksiyede stabil kalır (psödohipoksi), VEGF ve GLUT1 artar: ailesel feokromositoma, paraganglioma, GİST."},"tca:6":{title:"Fumaraz eksikliği ve HLRCC",text:"Homozigot FH eksikliği bebekte ensefalopati ve nöbet yapar. Heterozigot germline mutasyonda fumarat PHD’yi inhibe edip HIF-1α’yı ve KEAP1 süksinilasyonuyla NRF2’yi açar: leiomiyom ve tip 2 papiller RCC (HLRCC)."},"etz:0":{title:"Kompleks I bozuklukları (LHON, MELAS) ve metformin",text:"mtDNA mutasyonlarında en sık Kompleks I etkilenir: LHON ve MELAS. Rotenon ve MPP⁺ nigral nöronlarda Kompleks I’i bloke eder (Parkinson). Metformin Kompleks I’i hafif inhibe eder, AMP/ATP artar, AMPK glukoneogenezi ve lipogenezi baskılar."},"etz:1":{title:"Siyanür ve karbonmonoksit zehirlenmesi",text:"CN⁻ Kompleks IV’te sitokrom a₃ Fe³⁺’e bağlanır (histotoksik hipoksi): venöz kan parlak kırmızı kalır, anaerobik glikoliz ve laktik asidoz olur. Tedavi: hidroksikobalamin veya nitrit + tiyosülfat. CO, Kompleks IV ve Hb Fe²⁺’ye bağlanır."},"etz:2":{title:"Kemiozmotik ayırıcılar (2,4-DNP, salisilat, UCP-1)",text:"2,4-DNP ve yüksek doz salisilat protonları matrikse taşıyıp Δp’yi sıfırlar: ATP sentezi durur, O₂ tüketimi maksimuma çıkar, enerji ısı olur (hipertermi). UCP-1 kahverengi yağda aynı mantıkla titremesiz ısı üretir."},"lipogenez:0":{title:"ATP-sitrat liyaz ve bempedoik asit",text:"ACL, sitratı yağ asidi ve kolesterol sentezinin ortak öncülü olan sitozolik asetil-KoA’ya çevirir. Bempedoik asit prodrug’dır; aktivasyon enzimi ACSVL1 yalnızca karaciğerdedir, bu yüzden LDL düşer ancak statin gibi miyopati yapmaz."},"lipogenez:1":{title:"ACC, malonil-KoA ve MASLD",text:"İnsülin direncinde SREBP-1c ACC’yi sürekli uyarır; artan malonil-KoA hem FAS ile palmitat/TAG (VLDL) sentezini sürdürür hem CPT-I’i bloke edip β-oksidasyonu engeller: hepatosteatoz ve hipertrigliseridemi."},"lipogenez:2":{title:"De novo lipogenez, B5 ve tümör metabolizması",text:"FAS içindeki ACP, B5 türevi 4’-fosfopantetein koluyla zinciri taşır. Karaciğer, yağ dokusu ve laktasyondaki meme dışındaki normal erişkin dokularda FAS ifadesi düşüktür; meme, prostat ve kolon kanserlerinde membran lipidi için FASN aşırı artar ve ilaç hedefidir."},"beta_oks:0":{title:"İnsülin eksikliğinde kontrolsüz lipoliz ve niasin",text:"İnsülin PDE-3B ile cAMP’yi yıkıp HSL’yi frenler; tip 1 diyabette fren kalkar, FFA salınımı ve ketogenez (DKA) artar. Niasin GPR109A (Gi) ile cAMP’yi düşürüp HSL’yi inhibe eder; VLDL/LDL azalır, HDL artar (flushing)."},"beta_oks:1":{title:"Karnitin taşıyıcı (OCTN2), CPT-I ve CPT-II eksiklikleri",text:"Uzun zincirli yağ asitleri karnitin mekiği olmadan matrikse giremez: hipoketotik hipoglisemi, hiperamonyemi, kardiyomiyopati (OCTN2); erişkin CPT-II’de egzersizle rabdomiyoliz. Tedavide karnitin mekiği gerektirmeyen MCT kullanılır."},"beta_oks:2":{title:"MCAD eksikliği, Jamaika kusma hastalığı, Zellweger ve Refsum",text:"MCAD eksikliğinde açlıkta hipoketotik hipoglisemi, C8 artışı, dikarboksilik asidüri (Hipoglisin A aynı tabloyu yapar). VLCFA peroksizomda yıkılır: Zellweger/X-ALD’de birikir. Fitanik asit α-oksidasyon ister: PHYH eksikliği Refsum’dur."},"keton_kolesterol:0":{title:"Diyabetik ketoasidoz ve SCOT eksikliği",text:"Karaciğerde SCOT yoktur, ketonlar ihraç edilir (açlıkta beyin enerjisinin %60-70’i). Yüksek NADH/NAD⁺’da β-hidroksibütirat baskındır, nitroprussid stripi başta düşük kalabilir. SCOT eksikliğinde kalıcı ketozis ve ketoasidoz atakları olur."},"keton_kolesterol:1":{title:"Statinler, SREBP-2 döngüsü ve Smith-Lemli-Opitz",text:"Statin HMG-KoA redüktazı inhibe eder; SREBP-2 aktifleşir, LDLR artar, LDL-K düşer. Farnezil-PP yolunun azalması KoQ₁₀ ve prenilasyonu düşürüp miyopati/rabdomiyoliz yapabilir. DHCR7 eksikliği Smith-Lemli-Opitz sendromudur."},"ure_aa:0":{title:"HI/HA sendromu ve B6 (PLP) eksikliği",text:"GLUD1 aktive edici mutasyonunda GDH GTP frenini kaybeder; lösinli öğünden sonra insülin aşırı salınır (hipoglisemi) ve kalıcı hiperamonyemi olur. İzoniazid PLP’yi bağlar: transaminaz, GAD (nöbet) ve ALA sentaz (sideroblastik anemi) inhibe olur."},"ure_aa:1":{title:"Hiperamonyemik serebral ödem ve OTC / CPS-I ayırımı",text:"NH₄⁺ astrositte α-KG’yi tüketip TCA’yı durdurur ve glutamin birikimiyle ozmotik ödem yapar. CPS-I ve OTC eksikliğinde NH₃ ve glutamin yüksek, BUN ve arjinin düşüktür; yalnızca OTC’de karbamoil fosfat pirimidin yoluna taşıp orotik asidüri yapar."},"ure_aa:2":{title:"Üre döngüsü: sitrülinemi, ASL eksikliği, hiperarjininemi",text:"ASS eksikliğinde sitrülin >1000 µmol/L ve neonatal hiperamonyemi; ASL’de trikoreksis nodoza, karaciğer fibrozu; arjinaz-I’de hafif hiperamonyemi ve spastik dipleji. Benzoat ve fenilbütirat azot atar."}},function(){"use strict";const i=window.BIO_DATA,t='fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"',C='fill="currentColor"',ei={"chevron.right":`<path ${t} stroke-width="2.4" d="M9 5l7 7-7 7"/>`,"chevron.left":`<path ${t} stroke-width="2.4" d="M15 4.5L7.5 12l7.5 7.5"/>`,"chevron.down":`<path ${t} stroke-width="2.2" d="M5 9l7 7 7-7"/>`,xmark:`<path ${t} stroke-width="2.3" d="M6 6l12 12M18 6L6 18"/>`,"xmark.circle.fill":`<path ${C} fill-rule="evenodd" d="M12 2a10 10 0 110 20 10 10 0 010-20zm-3.3 5.3a1 1 0 00-1.4 1.4L10.6 12l-3.3 3.3a1 1 0 101.4 1.4l3.3-3.3 3.3 3.3a1 1 0 001.4-1.4L13.4 12l3.3-3.3a1 1 0 00-1.4-1.4L12 10.6z"/>`,plus:`<path ${t} stroke-width="2.2" d="M12 5v14M5 12h14"/>`,minus:`<path ${t} stroke-width="2.2" d="M5 12h14"/>`,magnifyingglass:`<circle ${t}
